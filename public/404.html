<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINT — 404</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container { padding: 2rem; }
    h1 { font-size: 6rem; font-weight: 900; opacity: 0.1; }
    p { color: rgba(255,255,255,0.4); margin: 1rem 0 2rem; font-weight: 300; }
    a {
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 0.75rem 2rem;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.3s;
    }
    a:hover { border-color: rgba(59,130,246,0.5); color: #93c5fd; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Pagina non trovata</p>
    <a href="/">Torna alla Home</a>
  </div>
  <script>
    // Redirect per SPA routing su GitHub Pages
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</body>
</html>
